<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>朋友祭_ゲーム</title>
        <meta name="description" content="プログラミング学習の成果物を公開している個人のポートフォリオサイトです。有害なコンテンツや商用目的のページは含まれていません。">
        <meta name="keywords" content="ポートフォリオ, プログラミング, 学習成果物, 個人サイト">
        <meta name="robots" content="index, follow">
        <meta name="rating" content="general">
        
        <style>
            body {
                font-family: sans-serif;
                background-color: #f9f9f9;
                margin: 0;
                padding: 20px;
            }

            h1 {
                text-align: center;
                margin-bottom: 30px;
            }

            /* 💡 ゲームと説明文を横並びにするための外枠（コンテナ） */
            .main-layout {
                display: flex;          /* 横並びにする指示 */
                flex-wrap: wrap;       /* 画面が狭いときは自動で上下に折り返す（スマホ対応） */
                justify-content: center;/* 中央寄せ */
                gap: 30px;             /* ゲームと説明文の間のスキマ */
                max-width: 1400px;     /* 全体の最大横幅 */
                margin: 0 auto;
            }

            /* 💡 左側：ゲームを表示する枠の設定 */
            .game-wrapper {
                flex: 1;               
                min-width: 320px;      
                max-width: 960px;      
                height: 600px;
                /* ⭕ 線の代わりに、ほんの少しだけ隙間（内側の余白）を作ります */
                padding: 4px;            /* これが実質、4pxの綺麗な黒枠になります */
                background-color: #000;  /* 枠の色（黒） */
                
                box-sizing: border-box;  
                line-height: 0;          
                overflow: hidden;
            }

            .game-banner {
                display: block;
                width: 100%;           /* 黒枠の横幅に100%ぴったり合わせる */
                height: auto;
                margin-bottom: 4px;    /* 画像とゲーム画面の間にほんの少しだけ隙間を作る（ピッタリくっつけたいなら 0 にしてください） */
            }

            .game-frame {
                width: 100%;
                aspect-ratio: 16 / 9;   
                border: none;           /* ❌ 線は完全に無しにします */
                display: block;
                transform: none;        /* ❌ 前回のズレ命令も綺麗にリセットします */
            }

            /* 💡 右側：注意点や説明文を入れる枠の設定 */
            .description-wrapper {
                flex: 0 0 320px;       /* 横幅を320pxに固定して綺麗に見せる */
                text-align: left;      /* 文章は左詰めで読みやすく */
                padding: 20px;
                background-color: #ffffff; /* 文字が見やすいように白背景 */
                border: 2px solid #ddd;    /* 薄いグレーの囲み線 */
                border-radius: 8px;        /* 角を少し丸く */
                box-shadow: 0 4px 6px rgba(0,0,0,0.05);
                align-self: flex-start;    /* 上揃えにする */
            }

            .description-wrapper h2 {
                margin-top: 0;
                font-size: 1.2rem;
                border-bottom: 2px solid black;
                padding-bottom: 5px;
            }

            .description-wrapper p {
                font-size: 0.95rem;
                line-height: 1.6;
                margin: 10px 0;
            }
        </style>
    </head>
    <body>
        <h1>朋友祭スロットゲーム</h1>
        
        <div class="main-layout">
            
            <div class="game-wrapper">
                <img src="./juggler_hand" alt="ゲーム看板" class="game-banner">
                <iframe src="./juggler_game/index.html" class="game-frame">
                    お使いのブラウザはiframeに対応していません
                </iframe>
            </div>
            
            <div class="description-wrapper">
                <h2>注意点および説明</h2>
                <p>・このサイトは学校行事専用のサイトです。</p>
                <p>・ランプ点灯確率は1/15です。</p>
                <p>・ボーナス中は1回転につき14COUNT増えます。</p>
                <p>・14COUNTにつき$1です。</p>
                <p>・時間等の関係でPAYOUTが$100になったら終了します。</p>
            </div>

        </div>
        </body>
</html>
