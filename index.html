<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>朋友祭_ゲーム</title>
        <style>
            body {
                background-color: #f0f0f0;
                font-family: sans-serif;
                text-align: center;
                padding: 20px;
                margin: 0;
            }

            /* 💡 ここを修正：画面からはみ出さないように最大サイズを制限します */
            .game-container {
                width: 95vw;       
                max-width: 972px;  /* ★ここを「972px」にすると、Unityの0.38倍とほぼ同じサイズになります */
                max-height: 85vh;  
                margin: 0 auto;    
                box-shadow: 0 4px 10px rgba(0,0,0,0.15);
                background-color: #000;
                line-height: 0;
                overflow: hidden;  
            }

            .game-frame {
                width: 100%;
                aspect-ratio: 16 / 9; /* 16:9の比率を維持 */
                border: none;
                display: block;
            }
        </style>
    </head>
    <body>
        <h1>注意点</h1>
        <p>ここにゲームの注意事項などを書いてください。</p>
        
        <div class="game-container">
            <iframe src="./juggler_game/index.html" class="game-frame">
                お使いのブラウザはiframeに対応していません
            </iframe>
        </div>
    </body>
</html>
