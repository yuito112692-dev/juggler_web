<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>朋友祭_ゲーム</title>
        <meta name="description" content="プログラミング学習の成果物。">
        <meta name="keywords" content="ポートフォリオ">
        <meta name="robots" content="index, follow">
        <meta name="rating" content="general">
        
        <style>
            body {
                font-family: sans-serif;
                background-color: #f9f9f9;
                margin: 0;
                padding: 20px;
            }

            /* 💡 ゲームと説明文を横並びにするための外枠 */
            .main-layout {
                display: flex;          
                flex-wrap: wrap;       
                justify-content: center;
                gap: 30px;             
                max-width: 1400px;     
                margin: 0 auto;
            }

            /* 💡 左側：ゲームエリア全体（一回り大きな外枠の線は消します） */
            .game-wrapper {
                flex: 1;               
                min-width: 320px;      
                max-width: 960px;      
                height: auto;          
                box-sizing: border-box;  
            }

            /* 💡 看板画像の設定（画像専用の黒枠をつけます） */
            .game-banner {
                display: block;
                width: 100%;           
                height: auto;          
                object-fit: contain;   
                
                border: 4px solid black;       /* ⭕ 画像の周りに4pxの黒枠 */
                border-bottom: none;           /* 💡 下側の線だけ消して、ゲーム画面と綺麗に繋げます */
                box-sizing: border-box;
            }

            /* 💡 ゲーム画面の設定（ゲーム専用の黒枠をつけます） */
            .game-frame {
                width: 100%;
                aspect-ratio: 16 / 9;   
                display: block;

                border: 4px solid black;       /* ⭕ ゲームの周りに4pxの黒枠（これが『間の線』になります！） */
                box-sizing: border-box;
            }

            /* 右側：注意点や説明文を入れる枠の設定 */
            .description-wrapper {
                flex: 0 0 320px;       
                text-align: left;      
                padding: 20px;
                background-color: #ffffff; 
                border: 2px solid #ddd;    
                border-radius: 8px;        
                box-shadow: 0 4px 6px rgba(0,0,0,0.05);
                align-self: flex-start;    
            }

            .description-wrapper h2 {
                margin-top: 0;
                font-size: 1.2rem;
                border-bottom: 2px solid black;
                padding-bottom: 5px;
            }

            .description-wrapper p {
                font-size: 0.95rem;
                line-height: 1.6;
                margin: 10px 0;
            }
        </style>
    </head>
    <body>
        <div class="main-layout">
            
            <div class="game-wrapper">
                <img src="./juggler_hand.png" alt="ゲーム看板" class="game-banner">
                <iframe src="./juggler_game/index.html" class="game-frame">
                    お使いのブラウザはiframeに対応していません
                </iframe>
            </div>
            
            <div class="description-wrapper">
                <h2>注意点および説明</h2>
                <p>・このサイトは学校行事専用のサイトです。</p>
                <p>・手作りのため、本物とは設定が異なることがありますが、ご了承ください。</p>
                <p>・ランプ点灯確率は1/15です。</p>
                <p>・ボーナス中は1回転につき14COUNT増えます。</p>
                <p>・BBは280COUNT、LBは140COUNTまで増えます。</p>
                <p>・14COUNTにつき$1です。</p>
                <p>・時間等の関係でPAYOUTが$100になったら終了します。</p>
                <p>・ぜひお楽しみください。</p>
            </div>

        </div>
    </body>
</html>
