<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>朋友祭_ゲーム</title>
        <style>
            body {
                background-color: #f0f0f0;
                font-family: sans-serif;
                text-align: center;
                padding: 20px;
                margin: 0;
            }

            /* 💡 ここを修正：画面からはみ出さないように最大サイズを制限します */
            .game-container {
                width: 95vw;       /* 画面の横幅の95%に収める */
                max-width: 800px;  /* ★パソコンで見た時の最大の横幅（小さくしたい場合は 700px などに下げてください） */
                max-height: 85vh;  /* 縦方向も画面からはみ出さないように制限 */
                margin: 0 auto;    /* 真ん中に寄せる */
                box-shadow: 0 4px 10px rgba(0,0,0,0.15);
                background-color: #000;
                line-height: 0;
                overflow: hidden;  /* はみ出しをカット */
            }

            .game-frame {
                width: 100%;
                aspect-ratio: 16 / 9; /* 16:9の比率を維持 */
                border: none;
                display: block;
            }
        </style>
    </head>
    <body>
        <h1>注意点</h1>
        <p>ここにゲームの注意事項などを書いてください。</p>
        
        <div class="game-container">
            <iframe src="./juggler_game/index.html" class="game-frame">
                お使いのブラウザはiframeに対応していません
            </iframe>
        </div>
    </body>
</html>
