<!DOCTYPE html>
<html lang="ja" style="width:100%; height:100%; margin:0; padding:0; overflow:hidden;">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player</title>
  </head>
  <body style="width:100%; height:100%; margin:0; padding:0; background-color:#000; overflow:hidden;">
    <canvas id="unity-canvas" style="width: 100vw; height: 100vh; display: block;"></canvas>

    <script>
      var canvas = document.querySelector("#unity-canvas");

      // 💡 Unityの読み込み設定（あなたのフォルダ構造に合わせて自動で読み込みます）
      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/juggler_game.loader.js"; // ★もしファイル名が違う場合は書き換えてください
      var config = {
        dataUrl: buildUrl + "/juggler_game.data",
        frameworkUrl: buildUrl + "/juggler_game.framework.js",
        codeUrl: buildUrl + "/juggler_game.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "juggler",
        productVersion: "1.0",
      };

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          // 読み込み中の処理（必要であれば）
        }).then((unityInstance) => {
          // 読み込み完了後の処理
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
